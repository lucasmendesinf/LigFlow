---
deployment:
  tasks:
    - export DEPLOYPATH=/home/calutecc/ligflow.calutec.com.br
    - /bin/mkdir -p $DEPLOYPATH/data $DEPLOYPATH/uploads/avatars $DEPLOYPATH/uploads/imports $DEPLOYPATH/migrations
    - /bin/cp -f index.php billing_domain.php asterisk_ari_worker.php $DEPLOYPATH/
    - /bin/cp -Rf assets $DEPLOYPATH/
    - /bin/cp -Rf migrations/. $DEPLOYPATH/migrations/
    - /bin/chmod 775 $DEPLOYPATH/data $DEPLOYPATH/uploads $DEPLOYPATH/uploads/avatars $DEPLOYPATH/uploads/imports
    - /bin/sh -c '/usr/bin/nohup /usr/bin/env php "$DEPLOYPATH/asterisk_ari_worker.php" >> "$DEPLOYPATH/data/asterisk_ari_worker.log" 2>&1 < /dev/null &'
